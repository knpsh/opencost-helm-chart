suite: Yandex CloudCost
templates:
  - templates/deployment.yaml
  - templates/configmap-custom-pricing.yaml
  - templates/configmap-frontend.yaml
  - templates/configmap-metrics-config.yaml
  - templates/secret-cloud-integration.yaml
  - templates/secret.yaml
  - templates/secret-admin-token.yaml
  - templates/secret-yandex-cloud.yaml
  - templates/configmap-yandex-cloud.yaml
set:
  opencost.cloudCost.enabled: true
  opencost.cloudCost.yandex.enabled: true
  opencost.cloudCost.yandex.billingAccountId: account
  opencost.exporter.yandexCloud.enabled: true
  opencost.exporter.yandexCloud.serviceAccountKey.existingSecret: opencost-yc-key
tests:
  - it: renders a single-replica deployment with integration mount and checksum
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/yandex-cloud-usage"]
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLOUD_COST_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: cloud-integration
            mountPath: /var/configs/cloud-integration/cloud-integration.json
            subPath: cloud-integration.json
            readOnly: true
  - it: generates integration configuration
    template: templates/secret-cloud-integration.yaml
    asserts:
      - isNotEmpty:
          path: data["cloud-integration.json"]
  - it: rejects conflicting manual configuration
    template: templates/deployment.yaml
    set:
      opencost.cloudIntegrationSecret: other
    asserts:
      - failedTemplate:
          errorMessage: Yandex CloudCost convenience settings and manual cloud integration sources are mutually exclusive
  - it: requires an account
    template: templates/deployment.yaml
    set:
      opencost.cloudCost.yandex.billingAccountId: ""
    asserts:
      - failedTemplate:
          errorMessage: Yandex CloudCost requires billingAccountId
  - it: requires one ingestion replica
    template: templates/deployment.yaml
    set:
      opencost.exporter.replicas: 2
    asserts:
      - failedTemplate:
          errorMessage: Yandex CloudCost requires exactly one exporter replica
  - it: requires CloudCost enabled
    template: templates/deployment.yaml
    set:
      opencost.cloudCost.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: Yandex CloudCost requires cloudCost.enabled and exporter.yandexCloud.enabled
